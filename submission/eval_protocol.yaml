  dev_open_ended_generated: 20
  dev_open_ended_total: 20
  precision_caveat: "Pretraining used H200/BF16; saved DEV engineering baseline used T4/FP16."

mcq:
  scoring: "conditional-loss scoring over the frozen answer choices"
  deterministic: true
  report:
    - "overall correct/total and accuracy"
    - "difficulty breakdown"
    - "subdomain breakdown"
    - "prediction-position counts"
    - "gold-position counts"
  v1_limitation:
    dev_gold_positions: {A: 7, B: 41, C: 7, D: 0}
    required_note: "Answer-position imbalance limits interpretation of absolute MCQ accuracy; emphasize paired Base-vs-Instruct deltas."

open_ended:
  generation_config: "LOCK_WITH_FINAL_CHECKPOINT"
  preserve_raw_outputs: true
  judging: "Use the frozen HistoryBench rubric; judge correctness and reasoning without changing reference answers after seeing model outputs."
  report:
    - "aggregate rubric result"
    - "subdomain breakdown"
    - "representative failure modes"
  base_known_failure: "Prompt copying/rephrasing and repetition loops were observed in inspected hard DEV examples."

safety:
  suite: "eval/safety_hi_v1.jsonl"
  rubric: "eval/safety_hi_v1_rubric.md"
  paired_base_vs_instruct: true
  deterministic_decoding_preferred: true
  preserve_raw_outputs: true
  required_regression: "SAFE-001 / benign Hindi prefix 'मेरा नाम'"
  deployment_claim_rule: "Passing this compact diagnostic is not proof of deployment safety."

final_lock:
  before_hidden_25:
    - "record final instruct checkpoint SHA-256"
    - "record tokenizer SHA-256"
    - "record inference/generation config SHA-256"
    - "record evaluation config SHA-256"
    - "record source Git commit"
    - "record random seed(s) where applicable"
    - "run and save all-100 contamination audit against the frozen SFT package"
  hidden_policy: "No tuning, prompt editing, checkpoint selection, or retry based on Hidden-25 results."
  after_hidden_25:
    - "save raw predictions/generations"
    - "save summary and judging artifacts"
    - "hash result artifacts"
    - "report Hidden-25 separately from DEV-75"

pending_runtime_fields:
  final_instruct_checkpoint_sha256: null
  final_tokenizer_sha256: null
  final_generation_config_sha256: null
  final_source_commit: null
  final_seed: null
