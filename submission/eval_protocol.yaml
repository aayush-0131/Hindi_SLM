schema_version: "1.0"
project: "Hindi SLM Capstone"
protocol_status: "FROZEN_BEFORE_FINAL_INSTRUCT_EVALUATION"

principles:
  - "Keep Base and Instruct results separate."
  - "Use HistoryBench DEV-75 for iterative model selection only."
  - "Use HistoryBench Hidden-25 exactly once, only after the final instruct checkpoint and config are locked and hashed."
  - "Do not alter HistoryBench-HI v1 wording, answers, labels, split, reference answers, or rubrics."
  - "Do not describe raw v1 MCQ accuracy as balanced four-way chance performance because DEV answer positions are strongly imbalanced."
  - "Preserve raw generations verbatim before manual judging."

benchmark:
  name: "HistoryBench-HI v1"
  frozen_csv_sha256: "21dc840c8d4fc07288ddbeaf61c4b8cf41e930b0504131e3252ab45d4e224fbe"
  dev_csv_sha256: "ac69ea72ba0721e9a934825e93070e4117f3554d66acb693aa4e4033ef5d78e5"
  hidden_csv_sha256: "9c8b56d2f528fdcede9a1a835a31a6479a791a0b786408745a614c167dfc90b2"
  dev_items: 75
  hidden_items: 25
  dev_mcq_items: 55
  dev_open_ended_items: 20

base_reference:
  checkpoint_label: "Stable-33750"
  checkpoint_sha256: "1ad56ea60a5e28d6899146a56f63b1833837dbe6f6cef9128bb2bf4a51faa00d"
  runtime: "Tesla T4 / FP16 / PyTorch 2.8.0+cu128"
  dev_mcq_correct: 15
  dev_mcq_total: 55
